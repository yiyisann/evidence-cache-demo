<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Actual output from the standalone evidence-cache demo</title><desc id="desc">A synthetic local model run, not a product screenshot or a production observation.</desc><rect width="1200" height="680" fill="#101419"/><text x="44" y="54" fill="#80d3cc" font-family="sans-serif" font-size="13">SYNTHETIC LOCAL DEMO RUN / NOT PRODUCTION DATA</text><text x="44" y="105" fill="#e6edf3" font-family="sans-serif" font-size="32">A failed refresh keeps the last useful fact</text><text x="44" y="145" fill="#aab7c4" font-family="sans-serif" font-size="16">Generated by calling the sample's state functions with fixed, fictional inputs.</text>
<rect x="44" y="195" width="1112" height="86" fill="#172028" stroke="#34404a"/><text x="64" y="223" fill="#e6edf3" font-family="sans-serif" font-size="17">1. Before observation</text><text x="64" y="255" fill="#80d3cc" font-family="sans-serif" font-size="17">UNKNOWN</text><text x="345" y="223" fill="#aab7c4" font-family="sans-serif" font-size="15">fact observed none / checked none</text><text x="345" y="255" fill="#e6edf3" font-family="sans-serif" font-size="17">No fact available</text>
<rect x="44" y="295" width="1112" height="86" fill="#172028" stroke="#34404a"/><text x="64" y="323" fill="#e6edf3" font-family="sans-serif" font-size="17">2. Observation accepted</text><text x="64" y="355" fill="#80d3cc" font-family="sans-serif" font-size="17">FRESH</text><text x="345" y="323" fill="#aab7c4" font-family="sans-serif" font-size="15">fact observed 00:00:00Z / checked 00:00:05Z</text><text x="345" y="355" fill="#e6edf3" font-family="sans-serif" font-size="17">Sample task is ready for review</text>
<rect x="44" y="395" width="1112" height="86" fill="#172028" stroke="#34404a"/><text x="64" y="423" fill="#e6edf3" font-family="sans-serif" font-size="17">3. Refresh fails</text><text x="64" y="455" fill="#80d3cc" font-family="sans-serif" font-size="17">STALE</text><text x="345" y="423" fill="#aab7c4" font-family="sans-serif" font-size="15">fact observed 00:00:00Z / checked 00:00:20Z</text><text x="345" y="455" fill="#e6edf3" font-family="sans-serif" font-size="17">Sample task is ready for review</text>
